<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!--
    viewport-fit=cover : iPad/iPhone のセーフエリアまで描画する
    user-scalable=no   : 手書き中のピンチ誤爆を防ぐ（拡大はアプリ内のボタンで提供）
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
  <meta name="description" content="日本を旅して魔王を倒す、47都道府県・県庁所在地の手書き学習RPG">
  <meta name="theme-color" content="#16233f">

  <!--
    アプリの版。せってい画面の下に出るので、
    「その端末が最新かどうか」を児童に読み上げてもらえば確かめられる。
    更新して公開するたびに、ここを書き変える。
  -->
  <meta name="app-version" content="2026-09-05e">

  <!-- iOS でホーム画面に追加したときにフルスクリーン起動させる -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="にっぽん冒険記">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">

  <title>にっぽん冒険記 ― 都道府県RPG</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/screens.css">
</head>
<body>
  <!--
    画面はすべて JS が #screen-root の中に組み立てて差し替える（SPA）。
    HTML 側には器だけを置き、構造の責務は src/ui/screens/* に集約する。
  -->
  <div id="app">
    <main id="screen-root" class="screen-root"></main>

    <!-- モーダル・演出のオーバーレイ用レイヤ -->
    <div id="overlay-root" class="overlay-root" aria-live="polite"></div>

    <!-- スクリーンリーダー向けの通知専用領域（視覚的には非表示） -->
    <div id="sr-announcer" class="visually-hidden" role="status" aria-live="assertive"></div>
  </div>

  <!--
    このゲームは横画面専用。
    手書き欄に6マス並べる必要があり、縦画面では1マスが小さくなりすぎて
    漢字が書けない。むりに詰め込むより、素直に持ち替えてもらう。
    CSS だけで出し分けるので、JSの読み込み前から機能する。
  -->
  <div id="rotate-hint" aria-live="polite">
    <svg viewBox="0 0 120 120" width="140" height="140" aria-hidden="true">
      <rect x="34" y="14" width="52" height="86" rx="7"
            fill="none" stroke="currentColor" stroke-width="5"/>
      <line x1="34" y1="26" x2="86" y2="26" stroke="currentColor" stroke-width="3"/>
      <path d="M20 84 A 44 44 0 0 0 60 108" fill="none" stroke="currentColor"
            stroke-width="5" stroke-linecap="round"/>
      <path d="M14 70 L20 86 L36 80 Z" fill="currentColor"/>
    </svg>
    <p class="rotate-hint__title">がめんを よこむきに してね</p>
    <p class="rotate-hint__note">
      よこむきにすると、字を書くマスが 大きくなって 書きやすくなります。
    </p>
  </div>

  <!-- JS 無効・読み込み失敗時のフォールバック -->
  <noscript>
    <p style="padding:2rem;color:#fff;font-size:1.2rem">
      このアプリを遊ぶには JavaScript を有効にしてください。
    </p>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
